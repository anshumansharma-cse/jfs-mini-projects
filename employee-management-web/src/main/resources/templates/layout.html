<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Employee Management'">Employee Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/dashboard">📋 Employee Management</a>
        </div>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/employees">Employees</a>
            <a href="/departments">Departments</a>
            <span class="nav-user">Welcome, <strong th:text="${#authentication.name}">User</strong></span>
            <a href="/logout" class="btn btn-sm btn-logout">Logout</a>
        </div>
    </nav>
    <main class="container">
        <div th:if="${success}" class="alert alert-success">
            <span th:utext="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            <span th:utext="${error}"></span>
        </div>
        <div th:replace="${contentFragment}"></div>
    </main>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
