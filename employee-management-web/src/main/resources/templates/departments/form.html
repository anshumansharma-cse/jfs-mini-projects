<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${department.id != null ? 'Edit Department' : 'Add Department'}">Department Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a href="/dashboard">📋 Employee Management</a></div>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/employees">Employees</a>
            <a href="/departments" class="active">Departments</a>
            <span>Welcome, <strong th:text="${#authentication.name}">User</strong></span>
            <a href="/logout" class="btn btn-sm btn-logout">Logout</a>
        </div>
    </nav>
    <main class="container">
        <h1 th:text="${department.id != null ? 'Edit Department' : 'Add Department'}">Department</h1>
        <form th:action="${department.id != null} ? @{/departments/{id}(id=${department.id})} : @{/departments}"
              method="post" th:object="${department}" class="form-card">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label for="name">Department Name *</label>
                <input type="text" id="name" th:field="*{name}" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="3"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="/departments" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
