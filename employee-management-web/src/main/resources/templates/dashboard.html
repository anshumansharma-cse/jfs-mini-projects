<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a href="/dashboard">📋 Employee Management</a></div>
        <div class="nav-links">
            <a href="/dashboard" class="active">Dashboard</a>
            <a href="/employees">Employees</a>
            <a href="/departments">Departments</a>
            <span>Welcome, <strong th:text="${#authentication.name}">User</strong></span>
            <a href="/logout" class="btn btn-sm btn-logout">Logout</a>
        </div>
    </nav>
    <main class="container">
        <h1>Dashboard</h1>
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Employees</h3>
                <p class="stat-value" th:text="${totalEmployees}">0</p>
            </div>
            <div class="stat-card">
                <h3>Active Employees</h3>
                <p class="stat-value" th:text="${activeEmployees}">0</p>
            </div>
            <div class="stat-card">
                <h3>Departments</h3>
                <p class="stat-value" th:text="${totalDepartments}">0</p>
            </div>
            <div class="stat-card">
                <h3>Recent (3 months)</h3>
                <p class="stat-value" th:text="${recentEmployees}">0</p>
            </div>
        </div>
        <div class="section">
            <h2>Employees by Department</h2>
            <table class="table">
                <thead><tr><th>Department</th><th>Employees</th></tr></thead>
                <tbody>
                    <tr th:each="entry : ${deptStats}">
                        <td th:text="${entry.key}">Department</td>
                        <td th:text="${entry.value}">0</td>
                    </tr>
                    <tr th:if="${#maps.isEmpty(deptStats)}">
                        <td colspan="2">No departments yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="section">
            <a href="/employees/new" class="btn btn-primary">+ Add Employee</a>
            <a href="/departments/new" class="btn btn-secondary">+ Add Department</a>
        </div>
    </main>
</body>
</html>
