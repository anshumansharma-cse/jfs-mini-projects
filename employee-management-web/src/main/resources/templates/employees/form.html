<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${employee.id != null ? 'Edit Employee' : 'Add Employee'}">Employee Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a href="/dashboard">📋 Employee Management</a></div>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/employees" class="active">Employees</a>
            <a href="/departments">Departments</a>
            <span>Welcome, <strong th:text="${#authentication.name}">User</strong></span>
            <a href="/logout" class="btn btn-sm btn-logout">Logout</a>
        </div>
    </nav>
    <main class="container">
        <h1 th:text="${employee.id != null ? 'Edit Employee' : 'Add Employee'}">Employee</h1>
        <form th:action="${employee.id != null} ? @{/employees/{id}(id=${employee.id})} : @{/employees}"
              method="post" th:object="${employee}" class="form-card">
            <input type="hidden" th:field="*{id}">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" th:field="*{firstName}" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" th:field="*{lastName}" required>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" th:field="*{phone}">
                </div>
                <div class="form-group">
                    <label for="jobTitle">Job Title *</label>
                    <input type="text" id="jobTitle" th:field="*{jobTitle}" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="salary">Salary</label>
                    <input type="number" id="salary" th:field="*{salary}" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="joiningDate">Joining Date</label>
                    <input type="date" id="joiningDate" th:field="*{joiningDate}">
                </div>
            </div>
            <div class="form-group">
                <label for="departmentId">Department</label>
                <select id="departmentId" th:field="*{departmentId}">
                    <option value="">-- Select --</option>
                    <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" th:field="*{active}"> Active
                </label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="/employees" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
