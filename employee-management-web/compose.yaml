services:
  employee-management:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems-app
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - JWT_SECRET=your-production-secret-key-here-change-this
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/db
      - SPRING_H2_CONSOLE_ENABLED=true
    volumes:
      - h2-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/dashboard"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  h2-data:
