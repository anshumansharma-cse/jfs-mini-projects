# Database Configuration
spring.datasource.url=jdbc:h2:file:./data/db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false

# JWT Secret - set via environment variable in production
# Default is development-only and must be changed for production
jwt.secret=${JWT_SECRET:dev-secret-key-that-must-be-changed-in-production-employsmanagement-system}
jwt.expiration=86400000

# Application
app.name=Employee Management System
app.description=JFS Module 3 Employee Management System
