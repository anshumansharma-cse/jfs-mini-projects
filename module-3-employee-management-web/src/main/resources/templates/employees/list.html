<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a href="/dashboard">📋 Employee Management</a></div>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/employees" class="active">Employees</a>
            <a href="/departments">Departments</a>
            <span>Welcome, <strong th:text="${#authentication.name}">User</strong></span>
            <a href="/logout" class="btn btn-sm btn-logout">Logout</a>
        </div>
    </nav>
    <main class="container">
        <h1>Employees</h1>
        <div class="toolbar">
            <form method="get" action="/employees" class="search-form">
                <input type="text" name="search" placeholder="Search by name, email, department..." th:value="${searchKeyword}">
                <button type="submit" class="btn btn-secondary">Search</button>
                <a href="/employees" class="btn btn-secondary">Clear</a>
            </form>
            <a href="/employees/new" class="btn btn-primary">+ Add Employee</a>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Job Title</th>
                    <th>Salary</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.fullName}">Name</td>
                    <td th:text="${emp.email}">email</td>
                    <td th:text="${emp.department != null ? emp.department.name : '-'}">Dept</td>
                    <td th:text="${emp.jobTitle}">Title</td>
                    <td th:text="${emp.salary != null ? '$' + emp.salary : '-'}">$0</td>
                    <td>
                        <span th:class="${emp.active ? 'badge badge-active' : 'badge badge-inactive'}"
                              th:text="${emp.active ? 'Active' : 'Inactive'}">Active</span>
                    </td>
                    <td class="actions">
                        <a th:href="@{/employees/{id}(id=${emp.id})}" class="btn btn-sm">View</a>
                        <a th:href="@{/employees/{id}/edit}(id=${emp.id})" class="btn btn-sm btn-secondary">Edit</a>
                        <form th:action="@{/employees/{id}/delete}(id=${emp.id})" method="post" style="display:inline" onsubmit="return confirm('Delete this employee?');">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${employees == null || employees.size() == 0}">
                    <td colspan="7">No employees found.</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
